<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Outil d'analyse des actualités{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon-32x32.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom-dark-blue {
            background-color: #2668aa !important;
        }
        
        .navbar-logos {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .navbar-logos img {
            height: 40px;
            max-width: 150px;
            object-fit: contain;
        }
        
        /* ADD THIS FOR LOGOUT BUTTON */
        .navbar-right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .btn-logout {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px 15px;
        }
        .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            color: white;
        }
        
        @media (max-width: 768px) {
            .navbar-logos {
                flex-direction: column;
                gap: 10px;
            }
            .navbar-logos img {
                height: 30px;
            }
        }
    </style>    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary navbar-custom-dark-blue">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Système d'analyse des actualités (AID-GEM)</a>

            <!-- Right side section with logout button and logos -->
            <div class="navbar-right-section ms-auto">
                <!-- LOGOUT BUTTON HERE -->
                <a href="{{ url_for('logout') }}" class="btn btn-sm btn-logout">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </a>
                
                <!-- Logos -->
                <div class="navbar-logos">
                    <a href="https://decadree.com/" target="_blank">
                        <img src="{{ url_for('static', filename='images/decadree_logo.png') }}" alt="Décadrée" class="img-fluid">
                    </a>   
                    <a href="https://www.hevs.ch/fr/recherche-appliquee-et-developpement-a-la-hes-so-valais-wallis/institut-informatique-valais/media-innovation-lab/" target="_blank">
                        <img src="{{ url_for('static', filename='images/hevs_logo.png') }}" alt="HES-SO Valais Wallis" class="img-fluid">
                    </a>               
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
